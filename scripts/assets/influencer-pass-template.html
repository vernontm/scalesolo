<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Sanabreh Influencer Pass — 4:5 flyer (1080 x 1350)
  Template placeholders: {{NAME}} and {{NUMBER}}
  Replace {{NAME}} with the influencer's name and {{NUMBER}} with a 4-digit
  sequential id (0001, 0002, ...). Open in a browser and screenshot the .pass
  element, or render to PNG.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C9A84C; --gold-lt:#E2C97E; --cream:#F5EDD8; --ink:#0A0A08;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#1a1a18;display:flex;justify-content:center;align-items:flex-start}
  .pass{
    position:relative;width:1080px;height:1350px;overflow:hidden;
    background:#0A0A08;font-family:'DM Sans',sans-serif;color:var(--cream);
  }
  /* background photo + darkening for legibility */
  .pass::before{
    content:"";position:absolute;inset:0;
    background:url('https://sanabrehrestaurant.com/images/lamb_chops.jpg') center/cover no-repeat;
    filter:saturate(1.05) brightness(.62);
  }
  .pass::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 50% 18%, rgba(0,0,0,.10), rgba(0,0,0,.78) 78%),
      linear-gradient(180deg, rgba(10,10,8,.55) 0%, rgba(10,10,8,.30) 38%, rgba(10,10,8,.82) 100%);
  }
  .frame{position:absolute;inset:38px;border:2px solid rgba(201,168,76,.55);z-index:2;pointer-events:none}
  .frame::before{content:"";position:absolute;inset:10px;border:1px solid rgba(226,201,126,.28)}
  .content{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;
    align-items:center;text-align:center;padding:104px 90px}
  /* header wordmark */
  .wordmark{font-family:'Cinzel',serif;font-weight:700;font-size:62px;letter-spacing:.10em;
    background:linear-gradient(180deg,var(--gold-lt),var(--gold));-webkit-background-clip:text;
    background-clip:text;color:transparent;line-height:1}
  .sub{font-family:'DM Sans',sans-serif;font-weight:500;font-size:19px;letter-spacing:.42em;
    text-transform:uppercase;color:var(--cream);opacity:.9;margin-top:14px}
  .rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px auto}
  /* welcome */
  .welcome{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    font-size:44px;color:var(--cream);margin-top:auto}
  .host{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--cream);opacity:.86;margin-top:6px}
  /* influencer tag + name */
  .tag{margin-top:54px;display:inline-block;font-family:'DM Sans',sans-serif;font-weight:600;
    font-size:20px;letter-spacing:.46em;text-transform:uppercase;color:var(--ink);
    background:linear-gradient(180deg,var(--gold-lt),var(--gold));padding:12px 30px 12px 36px;border-radius:999px}
  .name{font-family:'Cinzel',serif;font-weight:700;font-size:74px;line-height:1.05;
    color:var(--cream);margin-top:34px;text-shadow:0 2px 18px rgba(0,0,0,.5)}
  /* number badge */
  .num-wrap{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
  .num-label{font-family:'DM Sans',sans-serif;font-size:16px;letter-spacing:.40em;
    text-transform:uppercase;color:var(--gold-lt);opacity:.85}
  .num{font-family:'Cinzel',serif;font-weight:700;font-size:56px;letter-spacing:.14em;color:var(--gold);
    border:2px solid rgba(201,168,76,.6);border-radius:14px;padding:10px 30px;background:rgba(10,10,8,.35)}
</style>
</head>
<body>
  <div class="pass">
    <div class="frame"></div>
    <div class="content">
      <div class="wordmark">Sanabreh</div>
      <div class="sub">Mediterranean Restaurant</div>
      <div class="rule"></div>

      <div class="welcome">Welcome to Sanabreh</div>
      <div class="host">We are so excited to host you</div>

      <div class="tag">Influencer</div>
      <div class="name">{{NAME}}</div>

      <div class="num-wrap">
        <div class="num-label">Guest No.</div>
        <div class="num">{{NUMBER}}</div>
      </div>
    </div>
  </div>
</body>
</html>
