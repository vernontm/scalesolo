<!doctype html>
<html lang="en"
  data-composition-id="comparison-v1"
  data-composition-variables='[
    {"id":"left_label","type":"string","label":"Left label","default":"Before"},
    {"id":"left_title","type":"string","label":"Left title","default":"5-person team, slow ship cycle"},
    {"id":"left_text","type":"string","label":"Left description","default":"Meetings to align. Tickets to assign. Weeks between idea and live."},
    {"id":"right_label","type":"string","label":"Right label","default":"After"},
    {"id":"right_title","type":"string","label":"Right title","default":"Solo + AI, ship daily"},
    {"id":"right_accent_word","type":"string","label":"Right title accent","default":"ship daily"},
    {"id":"right_text","type":"string","label":"Right description","default":"One prompt away. Idea Monday, live Tuesday. The stack does the standup."},
    {"id":"accent_color","type":"color","label":"Accent color","default":"#e3151e"}
  ]'>
<head>
<meta charset="utf-8" />
<title>Comparison v1 — Sleek</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a0c; color: #fff;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
</style>
<link rel="stylesheet" href="/studio-compositions/_shared.css" />
<style>
  :root {
    --bg-base: #0a0a0c; --accent: #e3151e; --accent-glow: rgba(227,21,30,0.4);
    --text-secondary: rgba(255,255,255,0.65); --text-muted: rgba(255,255,255,0.4);
    --surface-border: rgba(255,255,255,0.12);
    --grid-color: rgba(227,21,30,0.15);
  }
  body { background: var(--bg-base); }
  .frame { position: absolute; inset: 0; overflow: hidden; }
  .frame::before {
    content: ''; position: absolute; inset: -20%;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: drift_slow 30s linear infinite;
    z-index: 1; pointer-events: none;
  }
  @keyframes drift_slow { from { transform: translate(0,0); } to { transform: translate(-50px,-50px); } }
  .frame::after {
    content: ''; position: absolute;
    top: -30%; right: -20%; width: 70%; height: 100%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
    z-index: 2; filter: blur(20px); pointer-events: none;
  }

  .comparison {
    position: relative; z-index: 3;
    height: 100%;
    display: flex;
    padding: 0 4%;
  }
  .col {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 0 3%;
  }
  .col-label {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(10px, 1vw, 13px);
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: clamp(14px, 1.6vw, 22px);
    padding: clamp(6px, 0.8vw, 10px) clamp(10px, 1.2vw, 16px);
    border-radius: 6px;
    width: fit-content;
    display: inline-flex; align-items: center;
  }
  .col-left .col-label {
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .col-right .col-label {
    color: var(--accent);
    background: rgba(227, 21, 30, 0.1);
    border: 1px solid rgba(227, 21, 30, 0.3);
    box-shadow: 0 0 20px rgba(227, 21, 30, 0.15);
  }
  .col h3 {
    font-weight: 900;
    font-size: clamp(26px, 3.4vw, 50px);
    line-height: 1.05;
    letter-spacing: -0.025em;
    margin-bottom: clamp(14px, 1.6vw, 22px);
  }
  .col-left h3 { color: var(--text-secondary); opacity: 0.6; }
  .col-right h3 .accent {
    color: var(--accent);
    text-shadow: 0 0 20px rgba(227, 21, 30, 0.5);
  }
  .col p {
    font-weight: 500;
    font-size: clamp(13px, 1.4vw, 19px);
    line-height: 1.5;
    color: var(--text-secondary);
  }
  .col-left p { opacity: 0.6; }

  .divider {
    width: 1px;
    background: linear-gradient(to bottom,
      transparent 0%,
      var(--surface-border) 20%,
      var(--surface-border) 80%,
      transparent 100%);
    margin: 8% 0;
    position: relative;
  }
  .divider::after {
    content: 'VS';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg-base);
    padding: 12px 8px;
    color: var(--accent);
    font-size: clamp(10px, 1vw, 13px);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-shadow: 0 0 10px var(--accent);
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="comparison">
    <div class="col col-left">
      <div class="col-label" id="left-label">Before</div>
      <h3 id="left-title">5-person team, slow ship cycle</h3>
      <p id="left-text">Meetings to align. Tickets to assign. Weeks between idea and live.</p>
    </div>
    <div class="divider"></div>
    <div class="col col-right">
      <div class="col-label" id="right-label">After</div>
      <h3 id="right-title"></h3>
      <p id="right-text">One prompt away. Idea Monday, live Tuesday. The stack does the standup.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="/studio-compositions/_runtime.js"></script>
  <script>
    (function () {
      const v = window.__studioVars
      const accent = v.accent_color || '#e3151e'
      const root = document.documentElement
      root.style.setProperty('--accent', accent)
      const hexToRgba = (hex, a) => {
        const m = (hex || '').match(/^#?([0-9a-f]{6})$/i)
        if (!m) return `rgba(227,21,30,${a})`
        const n = parseInt(m[1], 16)
        return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`
      }
      root.style.setProperty('--grid-color', hexToRgba(accent, 0.15))
      root.style.setProperty('--accent-glow', hexToRgba(accent, 0.4))

      if (v.left_label)  document.getElementById('left-label').textContent = v.left_label
      if (v.left_title)  document.getElementById('left-title').textContent = v.left_title
      if (v.left_text != null) document.getElementById('left-text').textContent = v.left_text
      if (v.right_label) document.getElementById('right-label').textContent = v.right_label
      if (v.right_text != null) document.getElementById('right-text').textContent = v.right_text

      // Right title with accent-word split
      const rt = v.right_title || 'Solo + AI, ship daily'
      const aw = (v.right_accent_word || '').trim()
      const rtEl = document.getElementById('right-title')
      if (aw && rt.toLowerCase().includes(aw.toLowerCase())) {
        const idx = rt.toLowerCase().indexOf(aw.toLowerCase())
        const before = rt.slice(0, idx)
        const match = rt.slice(idx, idx + aw.length)
        const after = rt.slice(idx + aw.length)
        rtEl.innerHTML = `${before}<span class="accent">${match}</span>${after}`
      } else {
        rtEl.textContent = rt
      }

      const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
      tl.from('.col-left',  { x: -40, opacity: 0, duration: 0.6 }, 0)
        .from('.col-right', { x: 40,  opacity: 0, duration: 0.6 }, 0.15)
        .from('.divider',   { scaleY: 0, opacity: 0, duration: 0.5 }, 0.3)
        .to({}, { duration: 1.6 })
      window.studioPlay(tl)
    })()
  </script>
</body>
</html>
