<!doctype html>
<html lang="en"
  data-composition-id="comparison-v1"
  data-composition-variables='[
    {"id":"left_label","type":"string","label":"Left label","default":"PERSONAL BRAND"},
    {"id":"left_text","type":"string","label":"Left description","default":"Film daily.\nEdit for hours.\nBurn out by month two."},
    {"id":"right_label","type":"string","label":"Right label","default":"FACELESS BRAND"},
    {"id":"right_text","type":"string","label":"Right description","default":"Set it once.\nShip on autopilot.\nStill posting in year three."},
    {"id":"accent_color","type":"color","label":"Accent color","default":"#e3151e"}
  ]'>
<head>
<meta charset="utf-8" />
<title>Comparison v1</title>
<!-- Critical brand styles inlined first so the iframe renders on the
     dark brand canvas with Plus Jakarta Sans even if _shared.css fails
     to load (Vercel rewrite race, network blip, cache poison). -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
</style>
<link rel="stylesheet" href="/studio-compositions/_shared.css" />
<style>
  .stage {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: clamp(20px, 3vw, 50px);
    padding: 0 4%;
  }
  .col {
    text-align: center;
    padding: clamp(20px, 3vw, 40px);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
  }
  .col.left { border-color: rgba(255, 255, 255, 0.12); }
  .col.right { border-color: rgba(227, 21, 30, 0.5); background: rgba(227, 21, 30, 0.06); }
  .col-label {
    font-size: clamp(12px, 1.6vw, 20px);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: clamp(16px, 2vw, 28px);
    color: rgba(255,255,255,0.5);
  }
  .col.right .col-label { color: #e3151e; }
  .col-text {
    font-size: clamp(18px, 2.4vw, 32px);
    font-weight: 700;
    line-height: 1.4;
    color: #fff;
    white-space: pre-line;
  }
  .col.left .col-text { color: rgba(255,255,255,0.55); }
  .divider {
    width: 2px;
    height: 60%;
    background: linear-gradient(180deg, transparent 0%, rgba(227,21,30,0.5) 50%, transparent 100%);
  }
  .glow {
    width: 60%;
    height: 60%;
    top: 20%;
    left: 20%;
    background: #e3151e;
    opacity: 0;
  }
</style>
</head>
<body>
  <div class="studio-grid"></div>
  <div class="studio-glow glow"></div>
  <div class="studio-stage" style="place-items: center stretch;">
    <div class="stage">
      <div class="col left">
        <div class="col-label" id="left-label">PERSONAL BRAND</div>
        <div class="col-text" id="left-text">Film daily.
Edit for hours.
Burn out by month two.</div>
      </div>
      <div class="divider"></div>
      <div class="col right">
        <div class="col-label" id="right-label">FACELESS BRAND</div>
        <div class="col-text" id="right-text">Set it once.
Ship on autopilot.
Still posting in year three.</div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="/studio-compositions/_runtime.js"></script>
  <script>
    (function () {
      window.studioApply({
        'left-label':  { var: 'left_label',  prop: 'textContent' },
        'left-text':   { var: 'left_text',   prop: 'textContent' },
        'right-label': { var: 'right_label', prop: 'textContent' },
        'right-text':  { var: 'right_text',  prop: 'textContent' },
      })
      const accent = window.__studioVars.accent_color || '#e3151e'
      document.querySelector('.glow').style.background = accent
      document.querySelector('.col.right').style.borderColor = accent + '80'
      document.querySelector('.col.right .col-label').style.color = accent

      const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
      tl.from('.col.left',  { x: -60, opacity: 0, duration: 0.6 }, 0)
        .from('.col.right', { x: 60,  opacity: 0, duration: 0.6 }, 0.1)
        .from('.divider',   { scaleY: 0, opacity: 0, duration: 0.5 }, 0.3)
        .to('.glow', { opacity: 0.4, duration: 1.2, ease: 'power2.out' }, 0)
        .to({}, { duration: 1.6 })
      window.studioPlay(tl)
    })()
  </script>
</body>
</html>
