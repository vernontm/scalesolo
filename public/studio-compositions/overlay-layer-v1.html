<!doctype html>
<html
  lang="en"
  data-composition-id="overlay-layer-v1"
  data-composition-variables='[
    {"id":"orientation","type":"enum","label":"Orientation","default":"landscape","options":[
      {"value":"landscape","label":"Landscape"},
      {"value":"vertical","label":"Vertical"}
    ]},
    {"id":"placements","type":"string","label":"Placements (JSON)","default":"[]"},
    {"id":"overlay_overrides","type":"string","label":"Overlay overrides (JSON, legacy — ignored)","default":"{}"},
    {"id":"template_id","type":"string","label":"Template id (drives token class)","default":"sleek"},
    {"id":"accent_color","type":"color","label":"Accent","default":"#e3151e"},
    {"id":"accent_2_color","type":"color","label":"Accent 2","default":"#ff3742"},
    {"id":"motion_entrance","type":"string","label":"Entrance primitive","default":"slide_up_fade"},
    {"id":"motion_exit","type":"string","label":"Exit primitive","default":"fade_out"},
    {"id":"motion_emphasis","type":"string","label":"Emphasis primitive","default":"pulse_glow"}
  ]'
>
<head>
<meta charset="UTF-8">
<title>Studio · Overlay Layer v1</title>
<link rel="stylesheet" href="/studio-compositions/_shared.css">
<!-- Universal overlay system. _ov-tokens.css declares one
     .tokens-<template> class per template; _ov-universal.css is
     the structural card library that consumes those tokens via
     CSS custom properties. _overlays.css remains for now as a
     compatibility shim (zone positioning was duplicated into the
     universal sheet); it's no longer authoritative. -->
<link rel="stylesheet" href="/studio-compositions/_ov-tokens.css">
<link rel="stylesheet" href="/studio-compositions/_ov-universal.css">
<link rel="stylesheet" href="/studio-compositions/_motion.css">
<style>
  /* Transparent canvas — this composition ONLY renders the overlay
     cards. The avatar footage is composited under it by ffmpeg in
     the final bake. */
  html, body { background: transparent !important; }
  .studio-grid, .studio-glow { display: none; }
  body { padding: 0; }
</style>
</head>
<body>

<!-- Token wrapper drives the entire card palette. The renderer
     injects identical HTML for every template; only this class
     name changes (tokens-sleek vs tokens-atlas vs ...). -->
<div id="token-root" class="tokens-sleek">
  <div id="overlay-root"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="/studio-compositions/_runtime.js"></script>
<script type="module">
  // Variable-driven composition: receives placements + template_id +
  // brand accents via window.__studioVars (URL hash) and renders the
  // overlay layer using the same renderOverlayLayer() the worker uses
  // server-side. Same code, two callsites → preview and final bake
  // stay pixel-identical.
  //
  // Browser copy is hand-kept in sync with api/studio/_lib/overlay-renderer.js.
  import { renderOverlayLayer } from '/studio-compositions/_overlay-renderer.js'

  const vars = window.__studioVars || {}

  let placements = []
  let overrides = {}
  try { placements = JSON.parse(vars.placements || '[]') } catch { placements = [] }
  try { overrides  = JSON.parse(vars.overlay_overrides || '{}') } catch { overrides = {} }

  // Activate the right token class. Defaults to Sleek for backwards
  // compatibility with renders that didn't pass template_id.
  const templateId = (vars.template_id || 'sleek').toString().toLowerCase()
  const validTokens = ['sleek', 'atlas', 'organic', 'retrovhs']
  const tokenClass = `tokens-${validTokens.includes(templateId) ? templateId : 'sleek'}`
  const tokenRoot = document.getElementById('token-root')
  tokenRoot.className = tokenClass

  // Brand-color overrides — when the user has a custom palette, push
  // it onto the same CSS custom properties so the tokens-<template>
  // base gets recolored without changing the class.
  if (vars.accent_color) tokenRoot.style.setProperty('--ov-accent', vars.accent_color)
  if (vars.accent_2_color) tokenRoot.style.setProperty('--ov-accent-2', vars.accent_2_color)

  const html = renderOverlayLayer({
    placements,
    orientation: vars.orientation || 'landscape',
    overlay_overrides: overrides,  // legacy — kept for backward compat
    accent: vars.accent_color || '#e3151e',
  })

  const root = document.getElementById('overlay-root')
  root.innerHTML = html

  // Apply the template's motion primitives to every card. Per the
  // architecture rule: one entrance, one exit, one emphasis — same 4
  // for every element. The renderer attaches classes; the CSS in
  // _motion.css handles the actual keyframes.
  const entrance = vars.motion_entrance || 'slide_up_fade'
  const emphasis = vars.motion_emphasis || 'pulse_glow'

  const cards = root.querySelectorAll('.ov > *')
  cards.forEach((card) => {
    card.classList.add(`motion-entrance-${entrance}`)
    if (emphasis && emphasis !== 'none') {
      card.classList.add(`motion-emphasis-${emphasis}`)
    }
  })

  // Build a paused GSAP timeline that just holds the composition for
  // its data-duration. The CSS animations carry the motion; GSAP is
  // here for HyperFrames timeline registration.
  const tl = gsap.timeline({ paused: true })
  tl.to({}, { duration: 1 })
  window.studioPlay(tl)
</script>

</body>
</html>
