<!doctype html>
<html
  lang="en"
  data-composition-id="sleek-scene-headline-v1"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Eyebrow","default":""},
    {"id":"title_chrome","type":"string","label":"Title (chrome part)","default":"Large headline text goes"},
    {"id":"title_accent","type":"string","label":"Title (accent part)","default":"right here"},
    {"id":"subtitle","type":"string","label":"Subtitle","default":""},
    {"id":"meta_label","type":"string","label":"Meta label","default":"VTM"},
    {"id":"meta_subtitle","type":"string","label":"Meta subtitle","default":"Scene"},
    {"id":"handle","type":"string","label":"Handle","default":"raytheaiguy"},
    {"id":"accent_color","type":"color","label":"Accent","default":"#e3151e"}
  ]'>
<head>
<meta charset="UTF-8">
<title>Sleek Scene — Centered Headline</title>
<link rel="stylesheet" href="/studio-compositions/_shared.css">
<style>
  :root {
    --bg-base: #0a0a0c;
    --accent: #e3151e;
    --accent-glow: rgba(227, 21, 30, 0.4);
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.4);
    --surface-card: rgba(255, 255, 255, 0.06);
    --surface-border: rgba(255, 255, 255, 0.12);
    --grid-color: rgba(227, 21, 30, 0.15);
  }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { display:flex; align-items:center; justify-content:center; margin:0; }

  .scene {
    position: relative;
    width: 1920px; height: 1080px;
    background: var(--bg-base);
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text-primary);
    transform-origin: center center;
  }
  /* Scale to fit any viewport (preview iframe + worker capture both use 1920x1080 so no scaling, but preserved for inline previews) */
  @media (max-width:1920px) { .scene { transform: scale(calc(100vw / 1920)); } }
  @media (max-height:1080px) { .scene { transform: scale(calc(100vh / 1080)); } }

  .scene::before {
    content:''; position:absolute; inset:-10%;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 80px 80px;
    animation: drift_diagonal 12s linear infinite;
    pointer-events:none; z-index:1;
  }
  @keyframes drift_diagonal { from { transform: translate(0,0); } to { transform: translate(-80px,-80px); } }

  .scene::after {
    content:''; position:absolute; top:-30%; right:-20%;
    width:70%; height:100%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
    pointer-events:none; z-index:2; filter: blur(40px);
  }

  .corner-mark { position:absolute; z-index:5; pointer-events:none; }
  .corner-mark.tl { top:60px; left:60px; }
  .corner-mark.tr { top:60px; right:60px; }
  .corner-mark.bl { bottom:60px; left:60px; }
  .corner-mark.br { bottom:60px; right:60px; }
  .corner-mark svg { width:60px; height:60px; opacity:0.4; }

  .scene-meta {
    position:absolute; top:60px; left:60px; z-index:6;
    display:flex; align-items:center; gap:16px;
    font-family: 'JetBrains Mono', monospace;
    font-size:12px; color: var(--text-muted);
    letter-spacing:0.2em; text-transform:uppercase;
  }
  .scene-meta .dot { width:8px; height:8px; background:var(--accent); border-radius:50%; box-shadow:0 0 12px var(--accent); }
  .scene-meta .divider { width:32px; height:1px; background:var(--surface-border); }

  .scene-handle {
    position:absolute; bottom:60px; right:60px; z-index:6;
    font-family: 'JetBrains Mono', monospace;
    font-size:13px; color: var(--text-secondary);
    letter-spacing:0.1em; font-weight:600;
  }
  .scene-handle::before { content:'@'; color:var(--accent); margin-right:4px; }

  .headline-block {
    position:relative; z-index:4;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:0 120px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size:16px; font-weight:600;
    letter-spacing:0.25em; text-transform:uppercase;
    color: var(--accent);
    margin-bottom:40px;
    display:flex; align-items:center; gap:18px;
  }
  .eyebrow::before, .eyebrow::after {
    content:''; width:40px; height:1.5px;
    background:var(--accent); box-shadow:0 0 10px var(--accent);
  }

  .headline {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight:900;
    font-size:132px; line-height:0.98;
    letter-spacing:-0.035em;
    max-width:1600px;
    margin-bottom:40px;
  }
  .headline .chrome {
    display:inline-block;
    background: linear-gradient(180deg, #ffffff 0%, #e8e8ed 40%, #8a8a92 50%, #d4d4dc 60%, #ffffff 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .headline .accent { display:inline-block; color:var(--accent); }

  .subtitle {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight:500; font-size:28px; line-height:1.4;
    color: var(--text-secondary);
    max-width:1100px; letter-spacing:-0.005em;
  }

  /* Emphasis loop on accent — runs continuously, not seek-driven. */
  @keyframes pulse_glow_text {
    0%, 100% { text-shadow: 0 0 20px rgba(227,21,30,0.5), 0 0 40px rgba(227,21,30,0.25); }
    50%      { text-shadow: 0 0 35px rgba(227,21,30,0.9), 0 0 70px rgba(227,21,30,0.5), 0 0 100px rgba(227,21,30,0.3); }
  }
  .headline .accent { animation: pulse_glow_text 4000ms ease-in-out infinite; }
</style>
</head>
<body>

<div class="scene">
  <div class="corner-mark tl"><svg viewBox="0 0 100 100" fill="none"><path d="M5 30 L 5 5 L 30 5" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark tr"><svg viewBox="0 0 100 100" fill="none"><path d="M70 5 L 95 5 L 95 30" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark bl"><svg viewBox="0 0 100 100" fill="none"><path d="M5 70 L 5 95 L 30 95" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark br"><svg viewBox="0 0 100 100" fill="none"><path d="M70 95 L 95 95 L 95 70" stroke="#e3151e" stroke-width="1.5"/></svg></div>

  <div class="scene-meta">
    <span class="dot"></span>
    <span id="meta-label">VTM</span>
    <span class="divider"></span>
    <span id="meta-subtitle">Scene</span>
  </div>

  <div class="scene-handle" id="handle">raytheaiguy</div>

  <div class="headline-block">
    <div class="eyebrow" id="eyebrow-wrap" style="display:none;"><span id="eyebrow"></span></div>
    <h1 class="headline">
      <span class="chrome" id="title-chrome">Large headline text goes</span>
      <span class="accent" id="title-accent">right here</span>
    </h1>
    <p class="subtitle" id="subtitle" style="display:none;"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="/studio-compositions/_runtime.js"></script>
<script>
  (function () {
    const v = window.__studioVars || {}
    if (v.title_chrome != null) document.getElementById('title-chrome').textContent = v.title_chrome
    if (v.title_accent != null) document.getElementById('title-accent').textContent = v.title_accent
    if (v.subtitle && String(v.subtitle).trim()) {
      const el = document.getElementById('subtitle')
      el.textContent = v.subtitle
      el.style.display = ''
    }
    if (v.eyebrow && String(v.eyebrow).trim()) {
      const wrap = document.getElementById('eyebrow-wrap')
      document.getElementById('eyebrow').textContent = v.eyebrow
      wrap.style.display = ''
    }
    if (v.handle) document.getElementById('handle').textContent = v.handle
    if (v.meta_label) document.getElementById('meta-label').textContent = v.meta_label
    if (v.meta_subtitle) document.getElementById('meta-subtitle').textContent = v.meta_subtitle
    if (v.accent_color) {
      document.documentElement.style.setProperty('--accent', v.accent_color)
    }

    // Drives standalone SFX trigger 'title_hero' (headline lands at ~1.0s).
    window.__hyperframes?.recordEvent?.('title_hero', 0.5)

    // Build GSAP timeline. The composition's CSS no longer ships the
    // entrance keyframes — GSAP owns them so worker can seek per-frame.
    const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
    tl.from('.eyebrow',                 { y: -10, opacity: 0, duration: 0.6 }, 0.1)
      .from('.headline .chrome',        { y: 20, opacity: 0, duration: 0.6 }, 0.2)
      .from('.headline .accent',        { y: 20, opacity: 0, duration: 0.6 }, 0.5)
      .from('.subtitle',                { y: 20, opacity: 0, duration: 0.6 }, 0.8)
      .from('.corner-mark',             { opacity: 0, duration: 0.8 }, 0.8)
      .from('.scene-meta, .scene-handle', { opacity: 0, duration: 0.6 }, 1.0)
      .to({}, { duration: 1.5 })  // hold tail
    window.studioPlay(tl)
  })()
</script>

</body>
</html>
