<!doctype html>
<html
  lang="en"
  data-composition-id="sleek-scene-claude-chat-v1"
  data-composition-variables='[
    {"id":"user_message","type":"string","label":"User message (what the speaker asked Claude)","default":"Build me a CRM in React with Supabase as the backend."},
    {"id":"claude_response","type":"string","label":"Claude response (typed word by word)","default":"I will set up a clean React + Supabase CRM with auth, contact management, and a deal pipeline. Let me start with the project structure and core schema."},
    {"id":"url_bar","type":"string","label":"URL bar text","default":"claude.ai/chat"},
    {"id":"meta_label","type":"string","label":"Meta label","default":"VTM"},
    {"id":"meta_subtitle","type":"string","label":"Meta subtitle","default":"Claude"},
    {"id":"handle","type":"string","label":"Handle","default":"raytheaiguy"},
    {"id":"accent_color","type":"color","label":"Accent","default":"#e3151e"}
  ]'>
<head>
<meta charset="UTF-8">
<title>Sleek Scene — Claude Chat</title>
<link rel="stylesheet" href="/studio-compositions/_shared.css">
<style>
  :root {
    --bg-base: #0a0a0c;
    --accent: #e3151e;
    --accent-glow: rgba(227, 21, 30, 0.4);
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.4);
    --surface-border: rgba(255, 255, 255, 0.12);
    --grid-color: rgba(227, 21, 30, 0.15);
    /* Authentic Claude colors */
    --claude-bg: #f5f1e8;
    --claude-surface: #ffffff;
    --claude-orange: #cc785c;
    --claude-text: #2a2a2a;
    --claude-text-muted: #6b6b6b;
    --claude-border: rgba(0, 0, 0, 0.08);
    --claude-user-bg: #ebe4d4;
  }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; margin:0; }
  body { display:flex; align-items:center; justify-content:center; }

  .scene {
    position:relative;
    width:1920px; height:1080px;
    background: var(--bg-base);
    overflow:hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text-primary);
    transform-origin:center center;
  }
  @media (max-width:1920px) { .scene { transform: scale(calc(100vw / 1920)); } }
  @media (max-height:1080px) { .scene { transform: scale(calc(100vh / 1080)); } }

  .scene::before {
    content:''; position:absolute; inset:-10%;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size:80px 80px;
    animation: drift_diagonal 12s linear infinite;
    pointer-events:none; z-index:1;
  }
  @keyframes drift_diagonal { from { transform: translate(0,0); } to { transform: translate(-80px,-80px); } }
  .scene::after {
    content:''; position:absolute; top:-30%; right:-20%;
    width:70%; height:100%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
    pointer-events:none; z-index:2; filter: blur(40px);
  }

  .corner-mark { position:absolute; z-index:5; pointer-events:none; }
  .corner-mark.tl { top:60px; left:60px; }
  .corner-mark.tr { top:60px; right:60px; }
  .corner-mark.bl { bottom:60px; left:60px; }
  .corner-mark.br { bottom:60px; right:60px; }
  .corner-mark svg { width:60px; height:60px; opacity:0.4; }

  .scene-meta {
    position:absolute; top:60px; left:60px; z-index:6;
    display:flex; align-items:center; gap:16px;
    font-family: 'JetBrains Mono', monospace;
    font-size:12px; color: var(--text-muted);
    letter-spacing:0.2em; text-transform:uppercase;
  }
  .scene-meta .dot { width:8px; height:8px; background:var(--accent); border-radius:50%; box-shadow:0 0 12px var(--accent); }
  .scene-meta .divider { width:32px; height:1px; background:var(--surface-border); }

  .scene-handle {
    position:absolute; bottom:60px; right:60px; z-index:6;
    font-family: 'JetBrains Mono', monospace;
    font-size:13px; color: var(--text-secondary);
    letter-spacing:0.1em; font-weight:600;
  }
  .scene-handle::before { content:'@'; color:var(--accent); margin-right:4px; }

  /* Claude chat panel — authentic Claude UI */
  .chat-panel {
    position:relative; z-index:4;
    width:1280px;
    margin: 130px auto 0;
    background: var(--claude-bg);
    border-radius:20px;
    overflow:hidden;
    box-shadow:
      0 30px 100px rgba(0,0,0,0.6),
      0 0 80px rgba(227,21,30,0.15),
      0 0 0 1px rgba(255,255,255,0.04);
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: var(--claude-text);
  }

  .chat-header {
    display:flex; align-items:center; gap:12px;
    padding:16px 22px;
    background: rgba(0,0,0,0.03);
    border-bottom:1px solid var(--claude-border);
  }
  .chat-header .traffic-lights { display:flex; gap:8px; }
  .chat-header .traffic-lights .light { width:13px; height:13px; border-radius:50%; }
  .chat-header .traffic-lights .light.red { background:#ff5f57; }
  .chat-header .traffic-lights .light.yellow { background:#febc2e; }
  .chat-header .traffic-lights .light.green { background:#28c840; }
  .chat-header .url-bar {
    flex:1;
    background: rgba(0,0,0,0.06);
    border-radius:8px;
    padding:6px 14px;
    font-size:13px; color: var(--claude-text-muted);
    text-align:center; letter-spacing:0.01em;
  }
  .chat-header .url-bar .lock { margin-right:6px; opacity:0.5; }

  .chat-body {
    padding: 60px 80px 70px;
    min-height: 600px;
  }

  .message-user {
    display:flex; justify-content:flex-end; margin-bottom:50px;
  }
  .message-user .bubble {
    background: var(--claude-user-bg);
    border-radius:18px; padding:18px 24px;
    font-size:22px; line-height:1.45;
    color: var(--claude-text);
    max-width:760px; font-weight:400;
    letter-spacing:-0.005em;
  }

  .message-claude { display:flex; gap:22px; align-items:flex-start; }
  .claude-avatar {
    flex-shrink:0;
    width:44px; height:44px; border-radius:50%;
    background: var(--claude-orange);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 8px rgba(204,120,92,0.3);
    margin-top:4px;
  }
  .claude-avatar svg { width:24px; height:24px; }
  .claude-response { flex:1; padding-top:4px; }
  .claude-response .author {
    font-weight:600; font-size:15px;
    color: var(--claude-text);
    margin-bottom:14px; letter-spacing:-0.01em;
  }
  .claude-response .content {
    font-size:22px; line-height:1.55;
    color: var(--claude-text);
    letter-spacing:-0.005em;
  }
  .claude-response .content .word {
    display: inline-block;
    opacity: 0;  /* GSAP reveals each word */
  }

  /* Blinking cursor — stays as CSS infinite loop */
  .typing-cursor {
    display:inline-block;
    width:9px; height:24px;
    background: var(--claude-text);
    margin-left:3px;
    vertical-align:text-bottom;
    animation: blink_cursor 0.9s steps(1) infinite;
  }
  @keyframes blink_cursor {
    0%, 50% { opacity:1; }
    50.01%, 100% { opacity:0; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="corner-mark tl"><svg viewBox="0 0 100 100" fill="none"><path d="M5 30 L 5 5 L 30 5" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark tr"><svg viewBox="0 0 100 100" fill="none"><path d="M70 5 L 95 5 L 95 30" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark bl"><svg viewBox="0 0 100 100" fill="none"><path d="M5 70 L 5 95 L 30 95" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark br"><svg viewBox="0 0 100 100" fill="none"><path d="M70 95 L 95 95 L 95 70" stroke="#e3151e" stroke-width="1.5"/></svg></div>

  <div class="scene-meta">
    <span class="dot"></span>
    <span id="meta-label">VTM</span>
    <span class="divider"></span>
    <span id="meta-subtitle">Claude</span>
  </div>

  <div class="scene-handle" id="handle">raytheaiguy</div>

  <div class="chat-panel">
    <div class="chat-header">
      <div class="traffic-lights">
        <span class="light red"></span>
        <span class="light yellow"></span>
        <span class="light green"></span>
      </div>
      <div class="url-bar"><span class="lock">🔒</span><span id="url-bar-text">claude.ai/chat</span></div>
    </div>

    <div class="chat-body">
      <div class="message-user">
        <div class="bubble" id="user-message">Build me a CRM in React with Supabase as the backend.</div>
      </div>

      <div class="message-claude">
        <div class="claude-avatar">
          <svg viewBox="0 0 24 24" fill="white">
            <path d="M12 2 L13 9 L20 10 L13 11 L12 18 L11 11 L4 10 L11 9 Z M12 18 L12.5 22 L11.5 22 Z"/>
          </svg>
        </div>
        <div class="claude-response">
          <div class="author">Claude</div>
          <div class="content" id="response-content">
            <span id="response-text"></span>
            <span class="typing-cursor" id="typing-cursor"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="/studio-compositions/_runtime.js"></script>
<script>
  (function () {
    const v = window.__studioVars || {}
    if (v.user_message) document.getElementById('user-message').textContent = v.user_message
    if (v.url_bar) document.getElementById('url-bar-text').textContent = v.url_bar
    if (v.handle) document.getElementById('handle').textContent = v.handle
    if (v.meta_label) document.getElementById('meta-label').textContent = v.meta_label
    if (v.meta_subtitle) document.getElementById('meta-subtitle').textContent = v.meta_subtitle
    if (v.accent_color) document.documentElement.style.setProperty('--accent', v.accent_color)

    // Wrap each word of the Claude response in a span so GSAP can
    // stagger their entrance. This is the "Claude is typing" effect —
    // word-by-word reveal at ~70ms per word.
    const responseText = String(v.claude_response || 'I will set up a clean React + Supabase CRM with auth, contact management, and a deal pipeline.')
    const responseEl = document.getElementById('response-text')
    const words = responseText.trim().split(/\s+/)
    responseEl.innerHTML = words.map((w) => `<span class="word">${w}</span>`).join(' ')

    // Standalone trigger: the message landing beat fires when the user
    // bubble appears (after the chat panel slides up).
    window.__hyperframes?.recordEvent?.('title_hero', 0.9)

    // Compute how long the word-by-word reveal takes so we know when
    // to hide the typing cursor (cursor stops blinking after last word).
    const wordIntervalSecs = 0.07
    const wordsRevealStart = 1.7
    const wordsRevealEnd = wordsRevealStart + words.length * wordIntervalSecs

    const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
    // Chat panel slides up
    tl.from('.chat-panel', { y: 20, opacity: 0, duration: 0.8 }, 0.1)
      // Corner marks + meta + handle fade in
      .from('.corner-mark', { opacity: 0, duration: 0.8 }, 0.4)
      .from('.scene-meta, .scene-handle', { opacity: 0, duration: 0.6 }, 0.6)
      // User message appears
      .from('.message-user', { y: 20, opacity: 0, duration: 0.5 }, 0.7)
      // Claude avatar + author
      .from('.claude-avatar', { opacity: 0, duration: 0.4 }, 1.3)
      .from('.claude-response .author', { opacity: 0, duration: 0.4 }, 1.5)
      // Words reveal one by one
      .to('.claude-response .content .word',
          { opacity: 1, y: 0, duration: 0.25, stagger: wordIntervalSecs },
          wordsRevealStart)
      // Hide cursor after the last word lands. set() at a specific time.
      .set('#typing-cursor', { display: 'none' }, wordsRevealEnd + 0.6)
      // Hold the final frame so viewers can read the full response.
      .to({}, { duration: 1.5 })
    // Pre-set words to their starting state so they don't flash before
    // the timeline kicks in (the .word spans are opacity:0 in CSS).
    gsap.set('.claude-response .content .word', { y: 6 })

    window.studioPlay(tl)
  })()
</script>

</body>
</html>
