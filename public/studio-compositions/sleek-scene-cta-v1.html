<!doctype html>
<html
  lang="en"
  data-composition-id="sleek-scene-cta-v1"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Eyebrow","default":""},
    {"id":"cta_headline_chrome","type":"string","label":"Headline (chrome)","default":"Learn how to use"},
    {"id":"cta_headline_accent","type":"string","label":"Headline (accent)","default":"AI"},
    {"id":"cta_subhead","type":"string","label":"Subhead","default":"Download over 100+ free guides on how to use AI and Claude."},
    {"id":"cta_button_text","type":"string","label":"Button text","default":"Link In Description"},
    {"id":"hero_handle","type":"string","label":"Hero handle (big bottom-center)","default":"raytheaiguy"},
    {"id":"meta_label","type":"string","label":"Meta label","default":"VTM"},
    {"id":"meta_subtitle","type":"string","label":"Meta subtitle","default":"End"},
    {"id":"accent_color","type":"color","label":"Accent","default":"#e3151e"}
  ]'>
<head>
<meta charset="UTF-8">
<title>Sleek Scene — CTA</title>
<link rel="stylesheet" href="/studio-compositions/_shared.css">
<style>
  :root {
    --bg-base: #0a0a0c;
    --accent: #e3151e;
    --accent-glow: rgba(227, 21, 30, 0.4);
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.4);
    --surface-card: rgba(255, 255, 255, 0.06);
    --surface-border: rgba(255, 255, 255, 0.12);
    --grid-color: rgba(227, 21, 30, 0.15);
  }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; margin:0; }
  body { display:flex; align-items:center; justify-content:center; }

  .scene {
    position:relative;
    width:1920px; height:1080px;
    background: var(--bg-base);
    overflow:hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text-primary);
    transform-origin:center center;
  }
  @media (max-width:1920px) { .scene { transform: scale(calc(100vw / 1920)); } }
  @media (max-height:1080px) { .scene { transform: scale(calc(100vh / 1080)); } }

  .scene::before {
    content:''; position:absolute; inset:-10%;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size:80px 80px;
    animation: drift_diagonal 12s linear infinite;
    pointer-events:none; z-index:1;
  }
  @keyframes drift_diagonal { from { transform: translate(0,0); } to { transform: translate(-80px,-80px); } }
  .scene::after {
    content:''; position:absolute; top:-20%; left:50%;
    transform:translateX(-50%);
    width:90%; height:100%;
    background: radial-gradient(ellipse, var(--accent-glow) 0%, transparent 55%);
    pointer-events:none; z-index:2; filter: blur(50px);
  }

  .corner-mark { position:absolute; z-index:5; pointer-events:none; }
  .corner-mark.tl { top:60px; left:60px; }
  .corner-mark.tr { top:60px; right:60px; }
  .corner-mark.bl { bottom:60px; left:60px; }
  .corner-mark.br { bottom:60px; right:60px; }
  .corner-mark svg { width:60px; height:60px; opacity:0.4; }

  .scene-meta {
    position:absolute; top:60px; left:60px; z-index:6;
    display:flex; align-items:center; gap:16px;
    font-family: 'JetBrains Mono', monospace;
    font-size:12px; color: var(--text-muted);
    letter-spacing:0.2em; text-transform:uppercase;
  }
  .scene-meta .dot { width:8px; height:8px; background:var(--accent); border-radius:50%; box-shadow:0 0 12px var(--accent); }
  .scene-meta .divider { width:32px; height:1px; background:var(--surface-border); }

  .hero-handle {
    position:absolute; bottom:80px; left:50%;
    transform:translateX(-50%);
    z-index:6;
    font-family:'JetBrains Mono', monospace;
    font-size:22px; color:var(--text-primary);
    letter-spacing:0.15em; font-weight:600;
  }
  .hero-handle::before {
    content:'@';
    color:var(--accent); margin-right:4px;
    text-shadow:0 0 12px var(--accent);
  }

  .cta-block {
    position:relative; z-index:4;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:0 120px;
  }

  .cta-eyebrow {
    font-family:'JetBrains Mono', monospace;
    font-size:16px; font-weight:700;
    letter-spacing:0.3em; text-transform:uppercase;
    color: var(--accent);
    margin-bottom:36px;
    display:flex; align-items:center; gap:18px;
  }
  .cta-eyebrow::before, .cta-eyebrow::after {
    content:''; width:50px; height:1.5px;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
  }

  .cta-headline {
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:900; font-size:124px;
    line-height:0.95; letter-spacing:-0.035em;
    margin-bottom:32px; max-width:1500px;
  }
  .cta-headline .chrome {
    background: linear-gradient(180deg, #ffffff 0%, #e8e8ed 40%, #8a8a92 50%, #d4d4dc 60%, #ffffff 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .cta-headline .accent { color: var(--accent); }

  .cta-subhead {
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:500; font-size:26px;
    line-height:1.4; color: var(--text-secondary);
    max-width:900px; margin-bottom:64px;
    letter-spacing:-0.005em;
  }

  .cta-button {
    display:inline-flex; align-items:center;
    gap:20px; padding:28px 56px;
    background:var(--accent); color:#ffffff;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:800; font-size:28px;
    letter-spacing:-0.005em;
    border-radius:16px;
    text-decoration:none;
    box-shadow:
      0 12px 40px rgba(227, 21, 30, 0.6),
      0 0 80px  rgba(227, 21, 30, 0.45),
      0 0 140px rgba(227, 21, 30, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    border:1px solid rgba(255, 255, 255, 0.15);
    position:relative;
  }
  .cta-button .icon { width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
  .cta-button .icon svg { width:100%; height:100%; }

  /* Emphasis loops — accent pulse + button breathe — continuous, not seek-driven. */
  @keyframes pulse_glow_text {
    0%, 100% { text-shadow: 0 0 20px rgba(227,21,30,0.5), 0 0 40px rgba(227,21,30,0.25); }
    50%      { text-shadow: 0 0 35px rgba(227,21,30,0.9), 0 0 70px rgba(227,21,30,0.5), 0 0 100px rgba(227,21,30,0.3); }
  }
  @keyframes button_breathe {
    0%, 100% {
      box-shadow:
        0 12px 40px rgba(227, 21, 30, 0.6),
        0 0 80px  rgba(227, 21, 30, 0.45),
        0 0 140px rgba(227, 21, 30, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    50% {
      box-shadow:
        0 14px 50px rgba(227, 21, 30, 0.75),
        0 0 110px rgba(227, 21, 30, 0.6),
        0 0 180px rgba(227, 21, 30, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
  }
  @keyframes arrow_bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(6px); }
  }
  .cta-headline .accent { animation: pulse_glow_text 2000ms ease-in-out infinite; }
  .cta-button           { animation: button_breathe 2500ms ease-in-out infinite; }
  .cta-button .icon     { animation: arrow_bounce 1500ms ease-in-out infinite; }
</style>
</head>
<body>

<div class="scene">
  <div class="corner-mark tl"><svg viewBox="0 0 100 100" fill="none"><path d="M5 30 L 5 5 L 30 5" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark tr"><svg viewBox="0 0 100 100" fill="none"><path d="M70 5 L 95 5 L 95 30" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark bl"><svg viewBox="0 0 100 100" fill="none"><path d="M5 70 L 5 95 L 30 95" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark br"><svg viewBox="0 0 100 100" fill="none"><path d="M70 95 L 95 95 L 95 70" stroke="#e3151e" stroke-width="1.5"/></svg></div>

  <div class="scene-meta">
    <span class="dot"></span>
    <span id="meta-label">VTM</span>
    <span class="divider"></span>
    <span id="meta-subtitle">End</span>
  </div>

  <div class="cta-block">
    <div class="cta-eyebrow" id="eyebrow-wrap" style="display:none;"><span id="eyebrow"></span></div>
    <h2 class="cta-headline">
      <span class="chrome" id="headline-chrome">Learn how to use</span>
      <span class="accent" id="headline-accent">AI</span>
    </h2>
    <p class="cta-subhead" id="subhead">Download over 100+ free guides on how to use AI and Claude.</p>
    <a class="cta-button" href="#" id="cta-button">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <polyline points="19 12 12 19 5 12"/>
        </svg>
      </span>
      <span id="button-text">Link In Description</span>
    </a>
  </div>

  <div class="hero-handle" id="hero-handle">raytheaiguy</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="/studio-compositions/_runtime.js"></script>
<script>
  (function () {
    const v = window.__studioVars || {}
    if (v.cta_headline_chrome != null) document.getElementById('headline-chrome').textContent = v.cta_headline_chrome
    if (v.cta_headline_accent != null) document.getElementById('headline-accent').textContent = v.cta_headline_accent
    if (v.cta_subhead != null) document.getElementById('subhead').textContent = v.cta_subhead
    if (v.cta_button_text != null) document.getElementById('button-text').textContent = v.cta_button_text
    if (v.hero_handle) document.getElementById('hero-handle').textContent = v.hero_handle
    if (v.meta_label) document.getElementById('meta-label').textContent = v.meta_label
    if (v.meta_subtitle) document.getElementById('meta-subtitle').textContent = v.meta_subtitle
    if (v.accent_color) document.documentElement.style.setProperty('--accent', v.accent_color)
    if (v.eyebrow && String(v.eyebrow).trim()) {
      document.getElementById('eyebrow').textContent = v.eyebrow
      document.getElementById('eyebrow-wrap').style.display = ''
    }

    // Fires when the CTA button visually lands (after the pop_in tween).
    window.__hyperframes?.recordEvent?.('end_card', 0.3)
    window.__hyperframes?.recordEvent?.('subscribe_cta', 1.1)

    const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
    tl.from('.cta-eyebrow',          { y: 20, opacity: 0, duration: 0.6 }, 0.1)
      .from('.cta-headline .chrome', { y: 20, opacity: 0, duration: 0.7 }, 0.3)
      .from('.cta-headline .accent', { y: 20, opacity: 0, duration: 0.7 }, 0.55)
      .from('.cta-subhead',          { y: 20, opacity: 0, duration: 0.6 }, 0.8)
      .from('.cta-button',           { scale: 0.85, opacity: 0, duration: 0.7, ease: 'back.out(1.5)' }, 1.1)
      .from('.hero-handle',          { y: 20, opacity: 0, duration: 0.6 }, 1.4)
      .from('.corner-mark',          { opacity: 0, duration: 0.8 }, 1.6)
      .from('.scene-meta',           { opacity: 0, duration: 0.6 }, 1.8)
      .to({}, { duration: 1.5 })  // hold the CTA so viewers actually see it
    window.studioPlay(tl)
  })()
</script>

</body>
</html>
