<!doctype html>
<html
  lang="en"
  data-composition-id="atlas-scene-list-v1"
  data-composition-variables='[
    {"id":"list_title_pre","type":"string","label":"List title (lead-in)","default":"The 3 tools running"},
    {"id":"list_title_highlight","type":"string","label":"List title (highlighted)","default":"my stack"},
    {"id":"items","type":"string","label":"Items (JSON array of {text, accent?})","default":"[]"},
    {"id":"meta_label","type":"string","label":"Meta label","default":"Atlas"},
    {"id":"meta_subtitle","type":"string","label":"Meta subtitle","default":"List"},
    {"id":"handle","type":"string","label":"Handle","default":"raytheaiguy"},
    {"id":"accent_color","type":"color","label":"Accent","default":"#818cf8"}
  ]'>
<head>
<meta charset="UTF-8">
<title>Atlas Scene Vertical — List</title>
<link rel="stylesheet" href="/studio-compositions/_shared.css">
<style>
  :root {
    --bg-base: #0a0a0f;
    --indigo: #6366f1; --indigo-soft: #818cf8;
    --purple: #a855f7; --purple-soft: #c084fc;
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.7);
    --text-muted: rgba(255,255,255,0.42);
    --surface-card: rgba(255,255,255,0.04);
    --surface-border: rgba(255,255,255,0.08);
    --dot-color: rgba(255,255,255,0.07);
    --dot-color-bright: rgba(129,140,248,0.65);
  }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; margin:0; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; }

  .scene {
    position:relative; width:1080px; height:1920px;
    background: var(--bg-base);
    overflow:hidden; color: var(--text-primary);
    transform-origin:center center;
  }
  @media (max-width:1080px) { .scene { transform: scale(calc(100vw / 1080)); } }
  @media (max-height:1920px) { .scene { transform: scale(calc(100vh / 1920)); } }

  .dots-base {
    position:absolute; inset:0;
    background-image: radial-gradient(circle, var(--dot-color) 1.5px, transparent 1.5px);
    background-size:28px 28px; pointer-events:none; z-index:1;
  }
  .dots-bright {
    position:absolute; inset:0;
    background-image: radial-gradient(circle, var(--dot-color-bright) 1.5px, transparent 1.5px);
    background-size:28px 28px; pointer-events:none; z-index:2;
    -webkit-mask-image: radial-gradient(400px circle at 50% 50%, black 0%, transparent 100%);
            mask-image: radial-gradient(400px circle at 50% 50%, black 0%, transparent 100%);
    animation: spotlight_orbit 18s ease-in-out infinite;
  }
  @keyframes spotlight_orbit {
    0%   { mask-position: 0% 0%;     -webkit-mask-position: 0% 0%; }
    20%  { mask-position: 25% -15%;  -webkit-mask-position: 25% -15%; }
    40%  { mask-position: 35% 20%;   -webkit-mask-position: 35% 20%; }
    60%  { mask-position: 5% 35%;    -webkit-mask-position: 5% 35%; }
    80%  { mask-position: -25% 15%;  -webkit-mask-position: -25% 15%; }
    100% { mask-position: 0% 0%;     -webkit-mask-position: 0% 0%; }
  }
  .scene::before {
    content:''; position:absolute;
    top:-20%; left:-10%; right:-10%; height:70%;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(99,102,241,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 30%, rgba(168,85,247,0.15) 0%, transparent 55%);
    pointer-events:none; z-index:3;
    filter: blur(40px);
  }

  .scene-meta {
    position:absolute; top:70px; left:50%; transform:translateX(-50%); z-index:6;
    display:flex; align-items:center; gap:14px;
    padding:10px 20px;
    background: var(--surface-card);
    border: 1px solid var(--surface-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius:999px;
    font-family:'JetBrains Mono', monospace;
    font-size:14px; color: var(--text-muted);
    letter-spacing:0.18em; text-transform:uppercase; font-weight:500;
  }
  .scene-meta .dot { width:8px; height:8px; background:var(--indigo-soft); border-radius:50%; box-shadow:0 0 12px var(--indigo-soft); }
  .scene-meta .divider { width:1px; height:12px; background:var(--surface-border); }

  .scene-handle {
    position:absolute; bottom:80px; left:50%; transform:translateX(-50%); z-index:6;
    font-family:'JetBrains Mono', monospace;
    font-size:20px; color: var(--text-secondary);
    letter-spacing:0.1em; font-weight:500;
  }
  .scene-handle::before {
    content:'@';
    background: linear-gradient(to right, var(--indigo), var(--purple));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-right:4px; font-weight:700;
  }

  .list-block {
    position:relative; z-index:7;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    justify-content:center; padding:0 80px;
  }
  .list-title {
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:800; font-size:84px;
    line-height:1.05; letter-spacing:-0.035em;
    margin-bottom:60px; text-align:center;
  }
  .list-title .highlight {
    position:relative; display:inline-block;
    padding:0 14px 6px; border-radius:12px;
    background-image: linear-gradient(to right, var(--indigo) 0%, var(--purple) 100%);
    background-repeat:no-repeat;
    background-position:left center;
    background-size:0% 100%;
    animation: highlight_sweep 1800ms ease-out 700ms forwards;
  }
  @keyframes highlight_sweep {
    0%   { background-size: 0% 100%; box-shadow: 0 0 0 rgba(129,140,248,0); }
    100% { background-size: 100% 100%; box-shadow: 0 0 50px rgba(129,140,248,0.3); }
  }

  .list-items { display:flex; flex-direction:column; gap:22px; list-style:none; padding:0; margin:0; }
  .list-item {
    display:flex; align-items:center; gap:28px;
    padding:30px 36px;
    background: var(--surface-card);
    border: 1px solid var(--surface-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius:20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .list-item .number {
    flex-shrink:0;
    width:72px; height:72px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--indigo) 0%, var(--purple) 100%);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:28px;
    color: var(--text-primary);
    box-shadow: 0 0 20px rgba(129,140,248,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .list-item .text {
    flex:1;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:600; font-size:38px;
    color: var(--text-primary);
    line-height:1.2; letter-spacing:-0.015em;
  }
  .list-item .text .accent {
    background: linear-gradient(to right, var(--indigo-soft), var(--purple-soft));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    font-weight:700;
  }
</style>
</head>
<body>

<div class="scene">
  <div class="dots-base"></div>
  <div class="dots-bright"></div>

  <div class="scene-meta">
    <span class="dot"></span>
    <span id="meta-label">Atlas</span>
    <span class="divider"></span>
    <span id="meta-subtitle">List</span>
  </div>

  <div class="scene-handle" id="handle">raytheaiguy</div>

  <div class="list-block">
    <h2 class="list-title">
      <span id="title-pre">The 3 tools running</span><br>
      <span class="highlight" id="title-highlight">my stack</span>
    </h2>
    <ul class="list-items" id="list-items"></ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="/studio-compositions/_runtime.js"></script>
<script>
  (function () {
    const v = window.__studioVars || {}
    if (v.list_title_pre != null) document.getElementById('title-pre').textContent = v.list_title_pre
    if (v.list_title_highlight != null) document.getElementById('title-highlight').textContent = v.list_title_highlight
    if (v.handle) document.getElementById('handle').textContent = v.handle
    if (v.meta_label) document.getElementById('meta-label').textContent = v.meta_label
    if (v.meta_subtitle) document.getElementById('meta-subtitle').textContent = v.meta_subtitle

    let items = []
    try { items = JSON.parse(v.items || '[]'); if (!Array.isArray(items)) items = [] } catch { items = [] }
    if (!items.length) {
      items = [
        { text: 'Claude for', accent: 'strategy' },
        { text: 'HeyGen for', accent: 'avatars' },
        { text: 'Supabase as the', accent: 'backbone' },
      ]
    }
    items = items.slice(0, 5)

    const listEl = document.getElementById('list-items')
    items.forEach((item, i) => {
      const li = document.createElement('li')
      li.className = 'list-item'
      const num = document.createElement('span')
      num.className = 'number'
      num.textContent = String(i + 1)
      const text = document.createElement('span')
      text.className = 'text'
      const plain = String(item.text || '').trim()
      // Guard against boolean "accent: true" the same way the Sleek
      // list comp does. Only accept string accents.
      const accent = (typeof item.accent === 'string') ? item.accent.trim() : ''
      if (accent) {
        text.innerHTML = `${plain} <span class="accent"></span>`
        text.querySelector('.accent').textContent = accent
      } else {
        text.textContent = plain
      }
      li.appendChild(num); li.appendChild(text)
      listEl.appendChild(li)
    })

    window.__hyperframes?.recordEvent?.('chapter_change', 0.5)

    const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
    tl.from('.list-title',  { y: 20, opacity: 0, duration: 0.7 }, 0.2)
      .from('.list-item',   { x: -30, opacity: 0, duration: 0.6, stagger: 0.15 }, 0.8)
      .from('.scene-meta',  { opacity: 0, duration: 0.6 }, 1.3)
      .from('.scene-handle',{ opacity: 0, duration: 0.6 }, 1.5)
      .to({}, { duration: 1.5 })
    window.studioPlay(tl)
  })()
</script>

</body>
</html>
