<!doctype html>
<html lang="en"
  data-composition-id="lower-third-v1"
  data-composition-variables='[
    {"id":"name","type":"string","label":"Name","default":"Ray Vernon"},
    {"id":"role","type":"string","label":"Role / handle","default":"Founder · Vernon Tech & Media"},
    {"id":"accent_color","type":"color","label":"Accent color","default":"#e3151e"}
  ]'>
<head>
<meta charset="utf-8" />
<title>Lower third v1 — Sleek</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent; color: #fff;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
</style>
<link rel="stylesheet" href="/studio-compositions/_shared.css" />
<style>
  :root {
    --accent: #e3151e;
    --surface-card: rgba(255,255,255,0.06);
    --surface-border: rgba(255,255,255,0.12);
    --text-primary: #fff;
  }
  /* Lower-third overlays other footage (avatar video, B-roll, etc.) so
     the page background stays transparent. The .studio-grid (from
     _shared.css) is also hidden so we don't paint over the underlying
     video with the brand grid pattern. */
  html, body { background: transparent !important; }
  .studio-grid { display: none; }

  .lower-third {
    position: absolute;
    left: 4%; bottom: 5%;
    display: flex; align-items: stretch; gap: 0;
    z-index: 4;
  }
  .accent-bar {
    width: 4px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    border-radius: 2px 0 0 2px;
  }
  .info-card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--surface-border);
    border-left: none;
    padding: clamp(14px, 1.5vw, 22px) clamp(20px, 2.2vw, 36px) clamp(14px, 1.5vw, 22px) clamp(16px, 1.8vw, 28px);
    border-radius: 0 12px 12px 0;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.4),
      0 0 30px rgba(227, 21, 30, 0.1);
  }
  .name {
    font-weight: 800;
    font-size: clamp(20px, 2.2vw, 32px);
    color: var(--text-primary);
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .role {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 600;
    font-size: clamp(10px, 1.05vw, 14px);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--accent);
  }
</style>
</head>
<body>
  <div class="lower-third">
    <div class="accent-bar"></div>
    <div class="info-card">
      <div class="name" id="name">Ray Vernon</div>
      <div class="role" id="role">Founder · Vernon Tech &amp; Media</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="/studio-compositions/_runtime.js"></script>
  <script>
    (function () {
      const v = window.__studioVars
      const accent = v.accent_color || '#e3151e'
      document.documentElement.style.setProperty('--accent', accent)

      if (v.name) document.getElementById('name').textContent = v.name
      if (v.role != null) document.getElementById('role').textContent = v.role

      const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
      tl.from('.lower-third', { x: -80, opacity: 0, duration: 0.6 }, 0)
        .from('.name',         { y: 12, opacity: 0, duration: 0.4 }, 0.2)
        .from('.role',         { y: 10, opacity: 0, duration: 0.4 }, 0.3)
        .to({}, { duration: 1.6 })
        .to('.lower-third', { x: -80, opacity: 0, duration: 0.4, ease: 'power2.in' })
      window.studioPlay(tl)
    })()
  </script>
</body>
</html>
