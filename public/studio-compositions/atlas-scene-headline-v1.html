<!doctype html>
<html
  lang="en"
  data-composition-id="atlas-scene-headline-v1"
  data-composition-variables='[
    {"id":"title_pre","type":"string","label":"Title (lead-in)","default":"Build your next idea with"},
    {"id":"title_highlight","type":"string","label":"Title (highlighted)","default":"AI as your team"},
    {"id":"meta_label","type":"string","label":"Meta label","default":"Atlas"},
    {"id":"meta_subtitle","type":"string","label":"Meta subtitle","default":"Scene"},
    {"id":"handle","type":"string","label":"Handle","default":"raytheaiguy"},
    {"id":"accent_color","type":"color","label":"Accent","default":"#818cf8"}
  ]'>
<head>
<meta charset="UTF-8">
<title>Atlas Scene Vertical — Centered Headline</title>
<link rel="stylesheet" href="/studio-compositions/_shared.css">
<style>
  :root {
    --bg-base: #0a0a0f;
    --indigo: #6366f1;
    --indigo-soft: #818cf8;
    --purple: #a855f7;
    --purple-soft: #c084fc;
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --text-muted: rgba(255, 255, 255, 0.42);
    --surface-card: rgba(255, 255, 255, 0.04);
    --surface-border: rgba(255, 255, 255, 0.08);
    --dot-color: rgba(255, 255, 255, 0.07);
    --dot-color-bright: rgba(129, 140, 248, 0.65);
  }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; margin:0; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',-apple-system,sans-serif; }

  .scene {
    position:relative;
    width:1080px; height:1920px;
    background: var(--bg-base);
    overflow:hidden;
    color: var(--text-primary);
    transform-origin:center center;
  }
  @media (max-width:1080px) { .scene { transform: scale(calc(100vw / 1080)); } }
  @media (max-height:1920px) { .scene { transform: scale(calc(100vh / 1920)); } }

  /* Layer 1: base dot pattern (always on, low contrast) */
  .dots-base {
    position:absolute; inset:0;
    background-image: radial-gradient(circle, var(--dot-color) 1.5px, transparent 1.5px);
    background-size:28px 28px;
    pointer-events:none; z-index:1;
  }
  /* Layer 2: bright indigo dots revealed in an orbiting spotlight mask */
  .dots-bright {
    position:absolute; inset:0;
    background-image: radial-gradient(circle, var(--dot-color-bright) 1.5px, transparent 1.5px);
    background-size:28px 28px;
    pointer-events:none; z-index:2;
    -webkit-mask-image: radial-gradient(400px circle at 50% 50%, black 0%, transparent 100%);
            mask-image: radial-gradient(400px circle at 50% 50%, black 0%, transparent 100%);
    animation: spotlight_orbit 18s ease-in-out infinite;
  }
  @keyframes spotlight_orbit {
    0%   { mask-position: 0% 0%;     -webkit-mask-position: 0% 0%; }
    20%  { mask-position: 25% -15%;  -webkit-mask-position: 25% -15%; }
    40%  { mask-position: 35% 20%;   -webkit-mask-position: 35% 20%; }
    60%  { mask-position: 5% 35%;    -webkit-mask-position: 5% 35%; }
    80%  { mask-position: -25% 15%;  -webkit-mask-position: -25% 15%; }
    100% { mask-position: 0% 0%;     -webkit-mask-position: 0% 0%; }
  }
  /* Layer 3: ambient indigo+purple wash up top */
  .scene::before {
    content:''; position:absolute;
    top:-20%; left:-10%; right:-10%; height:70%;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(99,102,241,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 30%, rgba(168,85,247,0.15) 0%, transparent 55%);
    pointer-events:none; z-index:3;
    filter: blur(40px);
  }

  .scene-meta {
    position:absolute; top:70px; left:50%;
    transform:translateX(-50%); z-index:6;
    display:flex; align-items:center; gap:14px;
    padding:10px 20px;
    background: var(--surface-card);
    border: 1px solid var(--surface-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius:999px;
    font-family:'JetBrains Mono', monospace;
    font-size:14px; color: var(--text-muted);
    letter-spacing:0.18em; text-transform:uppercase; font-weight:500;
  }
  .scene-meta .dot { width:8px; height:8px; background:var(--indigo-soft); border-radius:50%; box-shadow:0 0 12px var(--indigo-soft); }
  .scene-meta .divider { width:1px; height:12px; background:var(--surface-border); }

  .scene-handle {
    position:absolute; bottom:80px; left:50%;
    transform:translateX(-50%); z-index:6;
    font-family:'JetBrains Mono', monospace;
    font-size:20px; color: var(--text-secondary);
    letter-spacing:0.1em; font-weight:500;
  }
  .scene-handle::before {
    content:'@';
    background: linear-gradient(to right, var(--indigo), var(--purple));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-right:4px; font-weight:700;
  }

  .headline-block {
    position:relative; z-index:7;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:0 80px;
  }
  .headline {
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:800;
    font-size:120px;
    line-height:1.02;
    letter-spacing:-0.04em;
    max-width:920px;
    color: var(--text-primary);
  }
  .highlight {
    position:relative;
    display:inline-block;
    padding:0 16px 8px;
    border-radius:14px;
    color: var(--text-primary);
    background-image: linear-gradient(to right, var(--indigo) 0%, var(--purple) 100%);
    background-repeat:no-repeat;
    background-position:left center;
    background-size:0% 100%;
    box-shadow: 0 0 0 rgba(129,140,248,0);
    animation: highlight_sweep 2000ms ease-out 800ms forwards;
  }
  @keyframes highlight_sweep {
    0%   { background-size: 0% 100%;   box-shadow: 0 0 0 rgba(129,140,248,0); }
    100% { background-size: 100% 100%; box-shadow: 0 0 60px rgba(129,140,248,0.35); }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="dots-base"></div>
  <div class="dots-bright"></div>

  <div class="scene-meta">
    <span class="dot"></span>
    <span id="meta-label">Atlas</span>
    <span class="divider"></span>
    <span id="meta-subtitle">Scene</span>
  </div>

  <div class="scene-handle" id="handle">raytheaiguy</div>

  <div class="headline-block">
    <h1 class="headline">
      <span id="title-pre">Build your next idea with</span>
      <span class="highlight" id="title-highlight">AI as your team</span>
    </h1>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="/studio-compositions/_runtime.js"></script>
<script>
  (function () {
    const v = window.__studioVars || {}
    if (v.title_pre != null) document.getElementById('title-pre').textContent = v.title_pre
    if (v.title_highlight != null) document.getElementById('title-highlight').textContent = v.title_highlight
    if (v.handle) document.getElementById('handle').textContent = v.handle
    if (v.meta_label) document.getElementById('meta-label').textContent = v.meta_label
    if (v.meta_subtitle) document.getElementById('meta-subtitle').textContent = v.meta_subtitle

    window.__hyperframes?.recordEvent?.('title_hero', 0.6)

    const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
    tl.from('.headline',     { y: 30, opacity: 0, duration: 0.8 }, 0.2)
      .from('.scene-meta',   { y: 10, opacity: 0, duration: 0.6 }, 1.0)
      .from('.scene-handle', { y: 10, opacity: 0, duration: 0.6 }, 1.2)
      .to({}, { duration: 1.5 })  // hold for the highlight sweep to finish + reader to absorb
    window.studioPlay(tl)
  })()
</script>

</body>
</html>
