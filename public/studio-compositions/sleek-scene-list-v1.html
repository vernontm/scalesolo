<!doctype html>
<html
  lang="en"
  data-composition-id="sleek-scene-list-v1"
  data-composition-variables='[
    {"id":"list_title_chrome","type":"string","label":"List title (chrome part)","default":"The 3 tools running"},
    {"id":"list_title_accent","type":"string","label":"List title (accent part)","default":"my stack"},
    {"id":"items","type":"string","label":"Items (JSON array of {text, highlight?})","default":"[]"},
    {"id":"meta_label","type":"string","label":"Meta label","default":"VTM"},
    {"id":"meta_subtitle","type":"string","label":"Meta subtitle","default":"List"},
    {"id":"handle","type":"string","label":"Handle","default":"raytheaiguy"},
    {"id":"accent_color","type":"color","label":"Accent","default":"#e3151e"}
  ]'>
<head>
<meta charset="UTF-8">
<title>Sleek Scene — List</title>
<link rel="stylesheet" href="/studio-compositions/_shared.css">
<style>
  :root {
    --bg-base: #0a0a0c;
    --accent: #e3151e;
    --accent-glow: rgba(227, 21, 30, 0.4);
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-muted: rgba(255, 255, 255, 0.4);
    --surface-card: rgba(255, 255, 255, 0.06);
    --surface-border: rgba(255, 255, 255, 0.12);
    --grid-color: rgba(227, 21, 30, 0.15);
  }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { display:flex; align-items:center; justify-content:center; margin:0; }

  .scene {
    position: relative;
    width: 1920px; height: 1080px;
    background: var(--bg-base);
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text-primary);
    transform-origin: center center;
  }
  @media (max-width:1920px) { .scene { transform: scale(calc(100vw / 1920)); } }
  @media (max-height:1080px) { .scene { transform: scale(calc(100vh / 1080)); } }

  .scene::before {
    content:''; position:absolute; inset:-10%;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 80px 80px;
    animation: drift_diagonal 12s linear infinite;
    pointer-events:none; z-index:1;
  }
  @keyframes drift_diagonal { from { transform: translate(0,0); } to { transform: translate(-80px,-80px); } }
  .scene::after {
    content:''; position:absolute; top:-30%; right:-20%;
    width:70%; height:100%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
    pointer-events:none; z-index:2; filter: blur(40px);
  }

  .corner-mark { position:absolute; z-index:5; pointer-events:none; }
  .corner-mark.tl { top:60px; left:60px; }
  .corner-mark.tr { top:60px; right:60px; }
  .corner-mark.bl { bottom:60px; left:60px; }
  .corner-mark.br { bottom:60px; right:60px; }
  .corner-mark svg { width:60px; height:60px; opacity:0.4; }

  .scene-meta {
    position:absolute; top:60px; left:60px; z-index:6;
    display:flex; align-items:center; gap:16px;
    font-family: 'JetBrains Mono', monospace;
    font-size:12px; color: var(--text-muted);
    letter-spacing:0.2em; text-transform:uppercase;
  }
  .scene-meta .dot { width:8px; height:8px; background:var(--accent); border-radius:50%; box-shadow:0 0 12px var(--accent); }
  .scene-meta .divider { width:32px; height:1px; background:var(--surface-border); }

  .scene-handle {
    position:absolute; bottom:60px; right:60px; z-index:6;
    font-family: 'JetBrains Mono', monospace;
    font-size:13px; color: var(--text-secondary);
    letter-spacing:0.1em; font-weight:600;
  }
  .scene-handle::before { content:'@'; color:var(--accent); margin-right:4px; }

  .list-block {
    position:relative; z-index:4;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    justify-content:center; padding:0 160px;
  }

  .list-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight:900; font-size:80px;
    line-height:1.02; letter-spacing:-0.03em;
    margin-bottom:60px; max-width:1300px;
  }
  .list-title .chrome {
    background: linear-gradient(180deg, #ffffff 0%, #e8e8ed 40%, #8a8a92 50%, #d4d4dc 60%, #ffffff 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .list-title .accent { color: var(--accent); }

  .list-items {
    display:flex; flex-direction:column; gap:18px;
    max-width:1500px; list-style:none; padding:0; margin:0;
  }
  .list-item {
    display:flex; align-items:center; gap:28px;
    padding:26px 36px;
    background: var(--surface-card);
    border: 1px solid var(--surface-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .list-item .number {
    flex-shrink:0;
    font-family: 'JetBrains Mono', monospace;
    font-weight:700; font-size:18px;
    color: var(--accent);
    background: rgba(227, 21, 30, 0.12);
    border: 1px solid rgba(227, 21, 30, 0.4);
    padding:10px 14px; border-radius:8px;
    letter-spacing:0.08em;
    min-width:60px; text-align:center;
    box-shadow: 0 0 16px rgba(227, 21, 30, 0.2);
  }
  .list-item .text {
    flex:1;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight:600; font-size:36px;
    color: var(--text-primary);
    line-height:1.2; letter-spacing:-0.01em;
  }
  .list-item .text .highlight {
    color: var(--accent);
    text-shadow: 0 0 16px rgba(227, 21, 30, 0.5);
  }

  /* Emphasis on title accent (continuous loop — not seek-driven) */
  @keyframes pulse_glow_text {
    0%, 100% { text-shadow: 0 0 20px rgba(227,21,30,0.5), 0 0 40px rgba(227,21,30,0.25); }
    50%      { text-shadow: 0 0 35px rgba(227,21,30,0.9), 0 0 70px rgba(227,21,30,0.5), 0 0 100px rgba(227,21,30,0.3); }
  }
  .list-title .accent { animation: pulse_glow_text 2000ms ease-in-out infinite; }
</style>
</head>
<body>

<div class="scene">
  <div class="corner-mark tl"><svg viewBox="0 0 100 100" fill="none"><path d="M5 30 L 5 5 L 30 5" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark tr"><svg viewBox="0 0 100 100" fill="none"><path d="M70 5 L 95 5 L 95 30" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark bl"><svg viewBox="0 0 100 100" fill="none"><path d="M5 70 L 5 95 L 30 95" stroke="#e3151e" stroke-width="1.5"/></svg></div>
  <div class="corner-mark br"><svg viewBox="0 0 100 100" fill="none"><path d="M70 95 L 95 95 L 95 70" stroke="#e3151e" stroke-width="1.5"/></svg></div>

  <div class="scene-meta">
    <span class="dot"></span>
    <span id="meta-label">VTM</span>
    <span class="divider"></span>
    <span id="meta-subtitle">List</span>
  </div>

  <div class="scene-handle" id="handle">raytheaiguy</div>

  <div class="list-block">
    <h2 class="list-title">
      <span class="chrome" id="title-chrome">The 3 tools running</span>
      <span class="accent" id="title-accent">my stack</span>
    </h2>
    <ul class="list-items" id="list-items"></ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="/studio-compositions/_runtime.js"></script>
<script>
  (function () {
    const v = window.__studioVars || {}
    if (v.list_title_chrome != null) document.getElementById('title-chrome').textContent = v.list_title_chrome
    if (v.list_title_accent != null) document.getElementById('title-accent').textContent = v.list_title_accent
    if (v.handle) document.getElementById('handle').textContent = v.handle
    if (v.meta_label) document.getElementById('meta-label').textContent = v.meta_label
    if (v.meta_subtitle) document.getElementById('meta-subtitle').textContent = v.meta_subtitle
    if (v.accent_color) document.documentElement.style.setProperty('--accent', v.accent_color)

    // Parse items array. Falls back to a sensible default for preview.
    let items = []
    try {
      items = JSON.parse(v.items || '[]')
      if (!Array.isArray(items)) items = []
    } catch { items = [] }
    if (!items.length) {
      items = [
        { text: 'Claude for', highlight: 'strategy and execution' },
        { text: 'HeyGen for', highlight: 'avatar content' },
        { text: 'Supabase as the', highlight: 'silent backbone' },
      ]
    }
    items = items.slice(0, 5)  // hard cap — anything more breaks layout

    const listEl = document.getElementById('list-items')
    items.forEach((item, i) => {
      const li = document.createElement('li')
      li.className = 'list-item'
      const num = document.createElement('span')
      num.className = 'number'
      num.textContent = String(i + 1).padStart(2, '0')
      const text = document.createElement('span')
      text.className = 'text'
      // Support either: { text: "foo" } | { text: "foo", highlight: "bar" }.
      // Renders text + (optional highlighted suffix) as a single span chain.
      const plain = String(item.text || '').trim()
      const hl = String(item.highlight || '').trim()
      if (hl) {
        text.innerHTML = `${plain} <span class="highlight"></span>`
        text.querySelector('.highlight').textContent = hl
      } else {
        text.textContent = plain
      }
      li.appendChild(num)
      li.appendChild(text)
      listEl.appendChild(li)
    })

    // Fires once when the chapter / section visually establishes.
    window.__hyperframes?.recordEvent?.('chapter_change', 0.4)

    const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
    tl.from('.list-title',  { y: 20, opacity: 0, duration: 0.7 }, 0.2)
      .from('.list-item',   { x: -30, opacity: 0, duration: 0.6, stagger: 0.15 }, 0.7)
      .from('.corner-mark', { opacity: 0, duration: 0.8 }, 1.4)
      .from('.scene-meta, .scene-handle', { opacity: 0, duration: 0.6 }, 1.6)
      .to({}, { duration: 1.5 })  // hold tail
    window.studioPlay(tl)
  })()
</script>

</body>
</html>
