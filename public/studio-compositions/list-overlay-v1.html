<!doctype html>
<html lang="en"
  data-composition-id="list-overlay-v1"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Headline","default":"Three things faceless brands do right"},
    {"id":"bullets","type":"string","label":"Bullets (one per line)","default":"Ship daily, not perfectly\nUse one voice across every platform\nLet the AI handle the parts you hate"},
    {"id":"accent_color","type":"color","label":"Accent color","default":"#e3151e"}
  ]'>
<head>
<meta charset="utf-8" />
<title>List overlay v1</title>
<link rel="stylesheet" href="/studio-compositions/_shared.css" />
<style>
  .stage { width: 100%; max-width: 88%; text-align: left; padding-left: 4%; padding-right: 4%; }
  .title {
    font-size: clamp(36px, 5.5vw, 80px);
    margin-bottom: clamp(20px, 3vw, 40px);
    line-height: 1.05;
  }
  .bullets {
    list-style: none;
    display: grid;
    gap: clamp(14px, 1.8vw, 24px);
  }
  .bullets li {
    display: flex; align-items: flex-start; gap: 18px;
    font-size: clamp(22px, 3vw, 42px);
    font-weight: 600;
    color: #fff;
    line-height: 1.25;
  }
  .bullets li::before {
    content: '';
    flex-shrink: 0;
    width: clamp(8px, 1.1vw, 14px);
    height: clamp(8px, 1.1vw, 14px);
    border-radius: 50%;
    background: #e3151e;
    margin-top: clamp(14px, 1.6vw, 22px);
    box-shadow: 0 0 16px rgba(227, 21, 30, 0.6);
  }
  .glow {
    width: 60%;
    height: 60%;
    top: 20%;
    left: -10%;
    background: #e3151e;
    opacity: 0;
  }
</style>
</head>
<body>
  <div class="studio-grid"></div>
  <div class="studio-glow glow"></div>
  <div class="studio-stage" style="place-items: center stretch;">
    <div class="stage">
      <h2 class="studio-display studio-chrome title" id="title">Three things faceless brands do right</h2>
      <ul class="bullets" id="bullets"></ul>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="/studio-compositions/_runtime.js"></script>
  <script>
    (function () {
      window.studioApply({ title: { var: 'title', prop: 'textContent' } })
      const accent = window.__studioVars.accent_color || '#e3151e'
      document.querySelector('.glow').style.background = accent
      const bulletText = (window.__studioVars.bullets || 'Ship daily, not perfectly\nUse one voice across every platform\nLet the AI handle the parts you hate')
      const items = String(bulletText).split('\n').map((s) => s.trim()).filter(Boolean).slice(0, 5)
      const ul = document.getElementById('bullets')
      items.forEach((text) => {
        const li = document.createElement('li')
        li.textContent = text
        li.style.setProperty('--accent', accent)
        ul.appendChild(li)
      })
      // Update bullet dot color via inline style on the pseudo-element parent
      const style = document.createElement('style')
      style.textContent = `.bullets li::before { background: ${accent}; box-shadow: 0 0 16px ${accent}99; }`
      document.head.appendChild(style)

      const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } })
      tl.from('.title', { y: 40, opacity: 0, duration: 0.6 }, 0)
        .from('.bullets li', { y: 30, opacity: 0, duration: 0.5, stagger: 0.12 }, 0.25)
        .to('.glow', { opacity: 0.45, duration: 1, ease: 'power2.out' }, 0)
        .to({}, { duration: 1.6 })
      window.studioPlay(tl)
    })()
  </script>
</body>
</html>
