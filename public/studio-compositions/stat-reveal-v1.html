<!doctype html>
<html lang="en"
  data-composition-id="stat-reveal-v1"
  data-composition-variables='[
    {"id":"stat_number","type":"string","label":"Number","default":"403,840"},
    {"id":"stat_label","type":"string","label":"Label","default":"VIEWS IN 20 DAYS"},
    {"id":"stat_caption","type":"string","label":"Caption","default":"Zero ad spend. Zero face on camera."},
    {"id":"accent_color","type":"color","label":"Accent color","default":"#e3151e"}
  ]'>
<head>
<meta charset="utf-8" />
<title>Stat reveal v1</title>
<!-- Critical brand styles inlined first so the iframe renders on the
     dark brand canvas with Plus Jakarta Sans even if _shared.css fails
     to load (Vercel rewrite race, network blip, cache poison). -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
</style>
<link rel="stylesheet" href="/studio-compositions/_shared.css" />
<style>
  .stage { text-align: center; max-width: 90%; }
  .label {
    font-size: clamp(14px, 1.8vw, 22px);
    margin-bottom: clamp(8px, 1vw, 14px);
  }
  .number {
    margin-bottom: clamp(12px, 1.4vw, 22px);
  }
  .caption {
    font-size: clamp(18px, 2.2vw, 30px);
    color: rgba(255, 255, 255, 0.65);
    font-weight: 500;
  }
  .glow {
    width: 70%;
    height: 70%;
    top: 15%;
    left: 15%;
    background: #e3151e;
    opacity: 0;
  }
</style>
</head>
<body>
  <div class="studio-grid"></div>
  <div class="studio-glow glow"></div>
  <div class="studio-stage">
    <div class="stage">
      <div class="studio-eyebrow label" id="label">VIEWS IN 20 DAYS</div>
      <div class="studio-stat studio-accent number" id="number">403,840</div>
      <p class="caption" id="caption">Zero ad spend. Zero face on camera.</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="/studio-compositions/_runtime.js"></script>
  <script>
    (function () {
      window.studioApply({
        label:   { var: 'stat_label',   prop: 'textContent' },
        number:  { var: 'stat_number',  prop: 'textContent' },
        caption: { var: 'stat_caption', prop: 'textContent' },
      })
      const accent = window.__studioVars.accent_color || '#e3151e'
      document.querySelector('.glow').style.background = accent
      const num = document.getElementById('number')
      num.style.color = accent
      num.style.textShadow = `0 0 32px ${accent}80, 0 0 8px ${accent}aa`

      const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } })
      tl.from('.label',   { y: -20, opacity: 0, duration: 0.5 }, 0)
        .from('.number',  { scale: 0.6, opacity: 0, duration: 0.9, ease: 'back.out(1.4)' }, 0.15)
        .from('.caption', { y: 30, opacity: 0, duration: 0.55, ease: 'power3.out' }, 0.55)
        .to('.glow',      { opacity: 0.6, duration: 1, ease: 'power2.out' }, 0.1)
        .to({}, { duration: 1.4 })
      window.studioPlay(tl)
    })()
  </script>
</body>
</html>
