<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Thank you — ScaleSolo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Analytics: Meta Pixel + GA4 -->
<script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1865831664085007');
  fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1865831664085007&ev=PageView&noscript=1"/></noscript>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5QMW64V60M"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-5QMW64V60M');</script>
<style>
  :root{ --dark:#0c0b0f; --card:#17141b; --red:#ef4444; --red-deep:#b91c1c; --text:#f4f4f6; --muted:#a6a6b2; --line:rgba(255,255,255,0.12); --green:#37d27a; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--dark); color:var(--text); line-height:1.6; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 22px; }
  .glow{ position:fixed; inset:0; background:radial-gradient(60% 50% at 50% 0%, rgba(239,68,68,0.22), transparent 60%); pointer-events:none; }
  .wrap{ position:relative; max-width:600px; width:100%; }
  .check{ width:72px; height:72px; border-radius:50%; background:rgba(55,210,122,0.14); border:1px solid rgba(55,210,122,0.5); color:var(--green); display:flex; align-items:center; justify-content:center; font-size:36px; margin:0 auto 22px; }
  h1{ font-size:32px; font-weight:800; letter-spacing:-0.02em; line-height:1.1; }
  p.sub{ color:var(--muted); font-size:17px; margin-top:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; margin-top:26px; text-align:left; }
  .card .t{ font-weight:800; font-size:16px; }
  .card .d{ color:var(--muted); font-size:14px; margin-top:4px; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; max-width:420px; margin:14px auto 0; background:linear-gradient(135deg,var(--red),var(--red-deep)); color:#fff; font-weight:800; font-size:16px; padding:15px; border-radius:12px; border:none; cursor:pointer; box-shadow:0 12px 30px rgba(239,68,68,0.35); text-decoration:none; }
  .btn.ghost{ background:transparent; border:1px solid var(--line); box-shadow:none; color:var(--text); font-weight:700; }
  .btn.secondary{ background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.85); box-shadow:none; font-weight:700; border:1px solid rgba(255,255,255,0.14); }
  .btn.secondary:hover{ background:rgba(255,255,255,0.12); color:#fff; }
  .section-label{ text-align:left; max-width:560px; margin:32px auto 4px; font-size:11px; font-weight:800; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); padding:0 4px; }
  .dl-card{ display:flex; gap:18px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin:14px auto 0; max-width:560px; text-align:left; }
  .dl-card .dl-cover{ width:80px; height:auto; aspect-ratio:2/3; flex-shrink:0; border-radius:8px; object-fit:cover; box-shadow:0 8px 18px rgba(0,0,0,0.5); }
  .dl-card .dl-body{ flex:1; min-width:0; }
  .dl-card .dl-body .t{ font-weight:800; font-size:15px; }
  .dl-card .dl-body .d{ color:var(--muted); font-size:13px; margin:2px 0 10px; }
  .dl-card .dl-body .btn{ margin-top:0; padding:10px 14px; font-size:13.5px; max-width:none; width:auto; display:inline-flex; }
  .nav{ position:relative; display:flex; align-items:center; justify-content:center; gap:11px; margin-bottom:30px; }
  .nav .dot{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--red),var(--red-deep)); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; }
  .nav .brand{ font-weight:800; font-size:18px; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="nav"><span class="dot"><svg viewBox="0 0 24 24" width="16" height="16" fill="#fff" stroke="none" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span><span class="brand">ScaleSolo</span></div>
  <div class="check">&#10003;</div>
  <h1 id="headline">Thank you for your purchase.</h1>
  <p class="sub" id="subline">Your order is confirmed. A receipt is on its way to your email.</p>
  <div id="content"></div>
</div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var product = q.get('product') || '';
  var bump = q.get('bump') === '1';
  var c = document.getElementById('content');
  var head = document.getElementById('headline');
  var sub = document.getElementById('subline');

  // ── Conversion tracking — Purchase ─────────────────────────────────
  // Fires once per /welcome load. Session id is the Stripe checkout id
  // (or the OTO PaymentIntent id), which the server-side CAPI also uses
  // as event_id, so Facebook can dedupe browser + server events.
  (function trackPurchase(){
    var sessionId = q.get('session') || '';
    var upgradedNow = q.get('upgraded') === '1';
    var value = 0, name = '', contentId = '';
    if (product === 'tripwire'){
      value = 17 + (bump ? 9 : 0) + (upgradedNow ? 397 : 0);
      name = upgradedNow ? 'Tripwire + Done-For-You OTO' : (bump ? 'Tripwire + Content Pack' : 'Tripwire');
      contentId = upgradedNow ? 'tripwire+dfy-oto' : (bump ? 'tripwire+content-pack' : 'tripwire');
    } else if (product === 'dfy'){
      value = 397; name = 'Done-For-You Launch'; contentId = 'dfy';
    } else if (product === 'blueprint'){
      // Free Blueprint download — fire Lead, not Purchase.
      try { if (window.fbq) fbq('track', 'Lead', { content_name: 'Faceless AI Brand Blueprint' }); } catch(_){}
      try { if (window.gtag) gtag('event', 'generate_lead', { method: 'blueprint-download' }); } catch(_){}
      return;
    }
    if (!value) return;
    try {
      if (window.fbq) {
        fbq('track', 'Purchase', { value: value, currency: 'USD', content_name: name, content_ids: [contentId], content_type: 'product' }, sessionId ? { eventID: sessionId } : undefined);
      }
    } catch(_){}
    try {
      if (window.gtag) {
        gtag('event', 'purchase', { transaction_id: sessionId || undefined, currency: 'USD', value: value, items: [{ item_id: contentId, item_name: name, price: value, quantity: 1 }] });
      }
    } catch(_){}
  })();

  function card(t, d, href, label){
    var a = href ? '<a class="btn" href="'+href+'" download>'+label+'</a>' : '';
    return '<div class="card"><div class="t">'+t+'</div><div class="d">'+d+'</div>'+a+'</div>';
  }

  var upgraded = q.get('upgraded') === '1';
  if (product === 'tripwire'){
    head.textContent = upgraded ? 'You are all set. We will build it.' : 'You are in. Let us build your empire.';
    sub.textContent = upgraded
      ? 'Your playbook is below, and your Done-For-You Launch is confirmed. Book your kickoff call to get the build moving.'
      : 'Your purchase is confirmed and a receipt is on the way. Grab your downloads below.';
    // Layout intent on the post-tripwire welcome page:
    //   1. (if upgraded) kickoff call — most important next step for DFY buyers
    //   2. SCALE bonus card with embedded video — primary upsell, red CTA
    //   3. "Want it built for you instead?" — red secondary CTA (only if not upgraded)
    //   4. Your Downloads heading
    //   5. Compact download cards with cover thumbnails + gray secondary buttons
    //
    // The downloads are already paid for, so we mute their button color.
    // The two upgrade CTAs (SCALE + DFY pitch) stay red so they pop.
    var html = '';
    if (upgraded){
      html += card(
        'Book your kickoff call',
        'This is the most important next step. Grab a time and we will start your build on the call: your avatar, looks, voice, first videos, and auto-posting workflow.',
        'https://vernontm.com/book-call',
        'Book my kickoff call'
      );
    }
    // SCALE bonus — primary upsell, FIRST. Custom card so the video can
    // sit inside it. Upload 'Welcome - video.mp4' to the landing-media
    // bucket to make the player work.
    html += ''
      + '<div class="card">'
      +   '<div class="t">Lock in Founding with the SCALE bonus</div>'
      +   '<div class="d">Add the engine that actually runs the system: a ScaleSolo Founding membership at $79/mo locked for life, with +50% credits and a 1-on-1 setup call. Only via the SCALE code.</div>'
      +   '<div style="position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;box-shadow:0 16px 40px rgba(0,0,0,0.5);margin:16px 0 6px;">'
      +     '<video src="https://vbvmfiepwyxlfafbwtkb.supabase.co/storage/v1/object/public/landing-media/Welcome%20-%20video.mp4#t=0.1" controls playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block;background:#000;"></video>'
      +   '</div>'
      +   '<a class="btn" href="#founding-scale">Unlock the SCALE bonus &#8594;</a>'
      + '</div>';
    // DFY downsell — only if they did not already take the OTO upgrade.
    if (!upgraded){
      html += '<a class="btn" href="/done-for-you" style="max-width:560px;margin-top:14px;">Want it built for you instead? See the launch &#8594;</a>';
    }
    // Your Downloads — what they paid for. Compact horizontal cards with
    // cover thumbnails on the left and a muted gray button on the right
    // so the eye is naturally drawn to the red upgrade CTAs above.
    html += '<div class="section-label">Your Downloads</div>';
    html += ''
      + '<div class="dl-card">'
      +   '<img class="dl-cover" src="/media/ai-empire-cover.png" alt="Build Your AI Empire cover" loading="lazy">'
      +   '<div class="dl-body">'
      +     '<div class="t">Build Your AI Empire</div>'
      +     '<div class="d">Your monetization playbook. Save it and keep it open while you build.</div>'
      +     '<a class="btn secondary" href="/api/r/playbook?src=welcome" download data-track-download="playbook">Download the playbook</a>'
      +   '</div>'
      + '</div>';
    if (bump){
      html += ''
        + '<div class="dl-card">'
        +   '<img class="dl-cover" src="https://vbvmfiepwyxlfafbwtkb.supabase.co/storage/v1/object/public/landing-media/faceless-content-pack.jpg" alt="Faceless Content Pack cover" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
        +   '<div class="dl-body">'
        +     '<div class="t">Faceless Content Pack</div>'
        +     '<div class="d">50 ready-to-use outfits, settings, and poses, male and female.</div>'
        +     '<a class="btn secondary" href="/api/r/pack?src=welcome" download data-track-download="pack">Download the content pack</a>'
        +   '</div>'
        + '</div>';
    }
    c.innerHTML = html;
    // Wire the SCALE button to a public Founding checkout with the bonus code.
    var scaleBtn = c.querySelector('a[href="#founding-scale"]');
    if (scaleBtn){
      scaleBtn.addEventListener('click', async function(e){
        e.preventDefault();
        var label = scaleBtn.textContent;
        scaleBtn.style.pointerEvents='none'; scaleBtn.textContent='Loading…';
        try{
          var r = await fetch('/api/stripe-checkout-public', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ tier:'founding', billing_cycle:'monthly', skip_trial:true, bonus_code:'SCALE' })
          });
          var j = await r.json().catch(function(){ return {}; });
          if(!r.ok || !j.url) throw new Error(j.error || 'Could not start checkout.');
          window.location.href = j.url;
        }catch(err){
          scaleBtn.style.pointerEvents=''; scaleBtn.textContent=label;
          alert(err.message);
        }
      });
    }
  } else if (product === 'dfy'){
    head.textContent = 'Your Done-For-You Launch is booked.';
    sub.textContent = 'Payment confirmed. The fastest next step is to book your kickoff call so we can start building right away.';
    c.innerHTML = card(
      'Book your kickoff call',
      'Grab a time and we will start your build on the call: your avatar, looks, voice, first videos, and auto-posting workflow.',
      'https://vernontm.com/book-call',
      'Book my kickoff call'
    ) + card(
      'What happens next',
      'On the call we map your brand, then my team builds it and hands you the keys. Watch your inbox for your receipt and a short brand questionnaire.'
    );
  } else if (product === 'blueprint'){
    head.textContent = 'Your free Blueprint is on the way.';
    sub.textContent = 'Check your inbox in the next minute or two. (No worries on passing on the playbook, the door stays open.)';
    c.innerHTML = card(
      'While you wait',
      'When you are ready to actually monetize your faceless page, the playbook is still here. It is what turns views into real income.',
      '/build-your-ai-empire',
      'Take another look at the playbook'
    );
  } else {
    c.innerHTML = card('Order confirmed', 'Check your email for the details and receipt.');
  }

  // ─── Download click tracking (client-side) ────────────────────────
  // The download links 302 through /api/r/<asset> which logs the click
  // to Supabase contact_activity. This delegated handler ALSO fires
  // GA4 + Meta Pixel custom events so the same click shows up in
  // analytics dashboards. Defense in depth: if a browser blocks our
  // tracking pixel, the server-side log still has the click. If a
  // browser blocks our /api/r call (rare — same origin), GA4 still has it.
  document.addEventListener('click', function(e){
    var a = e.target.closest('a[data-track-download]');
    if (!a) return;
    var asset = a.getAttribute('data-track-download');
    try { if (window.fbq) fbq('trackCustom', 'AssetDownload', { asset: asset, source: 'welcome' }); } catch(_){}
    try { if (window.gtag) gtag('event', 'download', { asset_id: asset, asset_name: asset, source: 'welcome' }); } catch(_){}
  });
})();
</script>
</body>
</html>
